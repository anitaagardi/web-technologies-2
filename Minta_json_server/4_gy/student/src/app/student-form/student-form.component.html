<div class="example-container mat-elevation-z8">
  <div class="title-card">
    <mat-card>
      <h1 class="mat-headline">Add student</h1>
    </mat-card>
  </div>

  <form [formGroup]="studentForm" (ngSubmit)="onSubmit()">

    <mat-form-field class="form-element" appearance="fill">
      <mat-label>Name</mat-label>
      <input type="text" matInput  [formControl]="name" required>
      <mat-error *ngIf="name.invalid">{{getErrorMessage()}}</mat-error>
    </mat-form-field>

    <mat-divider></mat-divider>

    <mat-form-field class="form-element" appearance="fill">
      <mat-label>Neptun code</mat-label>
      <input type="text" matInput [formControl]="neptunCode" required>
      <mat-error *ngIf="neptunCode.invalid">{{getErrorMessage()}}</mat-error>
    </mat-form-field>

    <mat-divider></mat-divider>

    <mat-form-field class="form-element" appearance="fill">
      <mat-label>Address</mat-label>
      <input type="text" matInput [formControl]="address" required>
      <mat-error *ngIf="address.invalid">{{getErrorMessage()}}</mat-error>
    </mat-form-field>

    <mat-divider></mat-divider>

    <mat-form-field class="form-element" appearance="fill">
      <mat-label>Specialization</mat-label>
      <input type="text" matInput [formControl]="specialization" required>
      <mat-error *ngIf="specialization.invalid">{{getErrorMessage()}}</mat-error>
    </mat-form-field>

    <mat-divider></mat-divider>

    <mat-form-field class="form-element" appearance="fill">
      <mat-label>Age</mat-label>
      <input type="number" matInput [formControl]="age" required>
      <mat-error *ngIf="age.invalid">{{getErrorMessage()}}</mat-error>
    </mat-form-field>

    <mat-divider></mat-divider>


    <mat-divider></mat-divider>
    <button color="primary" mat-raised-button type="submit" [disabled]="!studentForm.valid" >Submit</button>
  </form>
</div>
