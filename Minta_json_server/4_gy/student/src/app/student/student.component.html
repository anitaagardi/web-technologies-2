<div class="watch-page-content">
  <mat-form-field class="value-filter">
    <mat-label>Filter</mat-label>
    <input matInput (keyup)="applyFilter($event)">
  </mat-form-field>

  <div class="mat-elevation-z8">
    <mat-table class="student-table" [dataSource]="dataSource"
               matSort matSortDirection="asc" matSortDisableClear>

      <ng-container matColumnDef="name">
        <mat-header-cell *matHeaderCellDef mat-sort-header>Name</mat-header-cell>
        <mat-cell *matCellDef="let student">{{student.name}}</mat-cell>
      </ng-container>

      <ng-container matColumnDef="neptunCode">
        <mat-header-cell *matHeaderCellDef mat-sort-header>Neptun Code</mat-header-cell>
        <mat-cell class="description-cell"
             *matCellDef="let student">{{student.neptunCode}}</mat-cell>
      </ng-container>

      <ng-container matColumnDef="address">
        <mat-header-cell *matHeaderCellDef mat-sort-header>Address</mat-header-cell>
        <mat-cell class="duration-cell"
             *matCellDef="let student">{{student.address}}</mat-cell>
      </ng-container>

      <ng-container matColumnDef="specialization">
        <mat-header-cell *matHeaderCellDef mat-sort-header>Specialization</mat-header-cell>
        <mat-cell class="duration-cell"
             *matCellDef="let student">{{student.specialization}}</mat-cell>
      </ng-container>

      <ng-container matColumnDef="age">
        <mat-header-cell *matHeaderCellDef mat-sort-header>Age</mat-header-cell>
        <mat-cell class="duration-cell"
             *matCellDef="let student">{{student.age}}</mat-cell>
      </ng-container>
      
      <ng-container matColumnDef="increaseAge">
        <mat-header-cell *matHeaderCellDef>Increase Age</mat-header-cell>
        <mat-cell class="duration-cell" *matCellDef="let student">
          <button (click)="increaseAge(student)" mat-raised-button color="accent" >+1</button>
        </mat-cell>
      </ng-container>

      <ng-container matColumnDef="delete">
        <mat-header-cell *matHeaderCellDef>Delete</mat-header-cell>
        <mat-cell class="duration-cell" *matCellDef="let student">
          <button (click)="delete(student)" mat-raised-button color="warn" ><mat-icon>delete</mat-icon></button>
        </mat-cell>
      </ng-container>


      <mat-header-row *matHeaderRowDef="columnsToDisplay; sticky: true"></mat-header-row>

      <mat-row *matRowDef="let row; columns: columnsToDisplay"></mat-row>

    </mat-table>
    <mat-paginator [pageSizeOptions]="[5, 10, 25, 50, 100]" showFirstLastButtons></mat-paginator>
  </div>
</div>
