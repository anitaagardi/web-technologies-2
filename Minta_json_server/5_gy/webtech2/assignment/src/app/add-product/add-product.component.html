<html>
<body>

  <mat-panel-title class="mat-title"> Műveletek </mat-panel-title>

  <p></p>

    <button mat-raised-button routerLinkActive="active" routerLink="/list-products" class="actbtn" >Listázás</button>

  <p></p>

  <mat-panel-title class="mat-title"> Új termék hozzáadása </mat-panel-title>

    <form [formGroup]="createForm" (ngSubmit)="onSubmit()" class="form" >
      <mat-form-field >
        <input matInput type="text" placeholder="Név" formControlName="name">
      </mat-form-field>
      <br>

      <mat-form-field >
        <input matInput  placeholder="Ár" type="number"  formControlName="price">
      </mat-form-field>
      <br>

      <mat-form-field >
        <input matInput  placeholder="Bolt" type="text"  formControlName="shop">
      </mat-form-field>
      <br>

      <mat-form-field >
        <input matInput  placeholder="Hely" type="text" formControlName="location">
      </mat-form-field>
      <br>

      <button mat-raised-button type="submit"  class="btn" >Hozzáadás</button>

    </form>


</body>
</html>
